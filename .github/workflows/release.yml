name: Desktop CI and release
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  security:
    name: Security
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality:
    name: Platform / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: desktop-quality-${{ matrix.platform }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
          cache: npm
      - name: Install the tested Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }} --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xvfb dbus-daemon
      - name: Verify source and covered behavior (no signing secrets)
        run: |
          mkdir -p reports
          npm ci
          node --test scripts/*-tests.mjs
          npm run build
          npm test -- --reporter=junit --outputFile=reports/frontend.xml
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee reports/native.log
          cargo test --locked --features ci-smoke --manifest-path src-tauri/Cargo.toml 2>&1 | tee reports/native-ci.log
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo clippy --locked --features ci-smoke --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Verify macOS release container contracts
        if: matrix.platform == 'macos'
        run: python -m unittest discover -s scripts -p 'release_test.py'
      - name: Build, inspect, and smoke secret-free platform installers
        if: matrix.platform != 'linux'
        run: node scripts/ci-platform.mjs build ${{ matrix.platform }} --smoke
      - name: Build, inspect, and smoke Linux packages under Xvfb
        if: matrix.platform == 'linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a node scripts/ci-platform.mjs build linux --smoke
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-bundles/${{ matrix.platform }}/*
            reports/*
          archive: true
          if-no-files-found: error
          retention-days: 14

  verify:
    name: CI / required
    needs: [quality, security]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every test, package, smoke, and security lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$QUALITY_RESULT" = success && test "$SECURITY_RESULT" = success

  reconcile:
    needs: verify
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 15
    # GitHub lists drafts only with push access. This job only reads releases.
    permissions:
      contents: write
    outputs:
      state: ${{ steps.preflight.outputs.state }}
      version: ${{ steps.preflight.outputs.version }}
      artifact-id: ${{ steps.preflight.outputs.artifact-id }}
      artifact-run-id: ${{ steps.preflight.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.preflight.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
      - name: Reconcile an existing exact-source release
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs preflight

  build:
    needs: reconcile
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
      - name: Install the tested Rust toolchain
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        if: needs.reconcile.outputs.state == 'build'
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          key: aarch64-apple-darwin
      - name: Stamp only this exact CI checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          node scripts/release.mjs stamp
          npm ci
      - name: Build signed updater archive and bootstrap DMG
        if: needs.reconcile.outputs.state == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --ci -- --locked
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: signed-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          archive: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  release-platforms:
    needs: reconcile
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
      - name: Install the tested Rust toolchain
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        if: needs.reconcile.outputs.state == 'build'
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}
      - name: Install Linux package dependencies
        if: needs.reconcile.outputs.state == 'build' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Stamp exact trusted main checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs stamp
          npm ci
      - name: Build and inspect platform release installers
        if: needs.reconcile.outputs.state == 'build'
        run: node scripts/ci-platform.mjs build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/${{ matrix.platform }}/*
          archive: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  assemble:
    # All production builders start after reconciliation and join before proof.
    needs: [reconcile, build, release-platforms]
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id || needs.reconcile.outputs.artifact-id }}
      artifact-run-id: ${{ steps.upload.outputs.artifact-id && github.run_id || needs.reconcile.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest || needs.reconcile.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
      - name: Install the tested Rust toolchain for assembly verification
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Stamp the same source and version for native bundle verification
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs stamp
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: signed-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/windows
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/linux
      - name: Verify signatures, app versions, architecture and provenance
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prepare
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        id: upload
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/*
          archive: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
      - name: Restore the original signed bundle for an incomplete draft
        if: needs.reconcile.outputs.state == 'reuse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.reconcile.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.reconcile.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.reconcile.outputs.artifact-digest }}
        run: node scripts/release.mjs restore

  publish:
    needs: [reconcile, assemble]
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    # Queue order is not commit order. The publisher also compares ancestry/version.
    concurrency:
      group: rayrag-release-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"
      - name: Restore and verify the exact workflow artifact
        if: needs.reconcile.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.assemble.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact-digest }}
        run: node scripts/release.mjs restore
      - name: Stage, verify and publish without moving latest backwards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ needs.reconcile.outputs.state }}
          RELEASE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.assemble.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact-digest }}
        run: node scripts/release.mjs publish
