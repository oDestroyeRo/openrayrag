name: Desktop CI and release
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: "1.98.1"
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}-bun-cache

jobs:
  security:
    name: Security
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality:
    name: Platform / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: desktop-quality-${{ matrix.platform }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install the tested Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }} --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          # Quality warms every build profile before the trusted release starts.
          shared-key: desktop-${{ matrix.target }}-${{ hashFiles('vendor/glib/**') }}
      - name: Restore Tauri packaging tools
        if: matrix.platform != 'macos'
        id: tauri-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xvfb dbus-daemon
      - name: Verify source and covered behavior (no signing secrets)
        run: |
          bun install --frozen-lockfile
          bun run check
      - name: Build, inspect, and smoke secret-free platform installers
        if: matrix.platform != 'linux'
        run: bun scripts/quality/ci-platform.mjs build ${{ matrix.platform }} --smoke
      - name: Build, inspect, and smoke Linux packages under Xvfb
        if: matrix.platform == 'linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a bun scripts/quality/ci-platform.mjs build linux --smoke
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-bundles/${{ matrix.platform }}/*
            reports/*
          archive: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save complete Bun package downloads from trusted main
        if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Save inspected Tauri packaging tools from trusted main
        if: matrix.platform != 'macos' && github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && steps.tauri-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: ${{ steps.tauri-cache.outputs.cache-primary-key }}

  verify:
    name: CI / required
    needs: [quality, security]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every test, package, smoke, and security lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$QUALITY_RESULT" = success && test "$SECURITY_RESULT" = success

  release:
    name: Release lifecycle
    needs: verify
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      actions: read
    # Serialize planning, reservation, builders, assembly and publication together.
    concurrency:
      group: rayrag-release-publication
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/release-publish.yml
    # Admit only these names; the callee's release environment provides values.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
