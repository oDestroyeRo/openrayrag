name: Desktop CI and release
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  quality:
    name: Platform / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xvfb
      - name: Verify source and covered behavior (no signing secrets)
        run: |
          mkdir -p reports
          npm ci
          node --test scripts/*-tests.mjs
          npm run build
          npm test -- --reporter=junit --outputFile=reports/frontend.xml
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee reports/native.log
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Verify macOS release container contracts
        if: matrix.platform == 'macos'
        run: python -m unittest discover -s scripts -p 'release_test.py'
      - name: Build and inspect secret-free platform installers
        run: node scripts/ci-platform.mjs build ${{ matrix.platform }} --smoke
      - name: Verify native startup, save, close, and restore
        if: matrix.platform != 'linux'
        run: node scripts/native-smoke.mjs --binary src-tauri/target/${{ matrix.target }}/release/rayrag-companion${{ matrix.platform == 'windows' && '.exe' || '' }} --output reports/smoke.json
      - name: Verify native Linux WebView under Xvfb
        if: matrix.platform == 'linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a node scripts/native-smoke.mjs --binary src-tauri/target/${{ matrix.target }}/release/rayrag-companion --output reports/smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-bundles/${{ matrix.platform }}/*
            reports/*
          if-no-files-found: error
          retention-days: 14

  verify:
    name: CI / required
    needs: quality
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every test, package, and smoke lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success

  reconcile:
    needs: verify
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 15
    # GitHub lists drafts only with push access. This job only reads releases.
    permissions:
      contents: write
    outputs:
      state: ${{ steps.preflight.outputs.state }}
      version: ${{ steps.preflight.outputs.version }}
      artifact-id: ${{ steps.preflight.outputs.artifact-id }}
      artifact-run-id: ${{ steps.preflight.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.preflight.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - name: Reconcile an existing exact-source release
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs preflight

  build:
    needs: [reconcile, release-platforms]
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id || needs.reconcile.outputs.artifact-id }}
      artifact-run-id: ${{ steps.upload.outputs.artifact-id && github.run_id || needs.reconcile.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest || needs.reconcile.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        if: needs.reconcile.outputs.state == 'build'
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin
      - name: Stamp only this exact CI checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          node scripts/release.mjs stamp
          npm ci
      - name: Build signed updater archive and bootstrap DMG
        if: needs.reconcile.outputs.state == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --ci -- --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/linux
      - name: Verify signatures, app versions, architecture and provenance
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.reconcile.outputs.state == 'build'
        id: upload
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
      - name: Restore the original signed bundle for an incomplete draft
        if: needs.reconcile.outputs.state == 'reuse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.reconcile.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.reconcile.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.reconcile.outputs.artifact-digest }}
        run: node scripts/release.mjs restore

  release-platforms:
    needs: reconcile
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        if: needs.reconcile.outputs.state == 'build'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.reconcile.outputs.state == 'build'
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux package dependencies
        if: needs.reconcile.outputs.state == 'build' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Stamp exact trusted main checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs stamp
          npm ci
      - name: Build and inspect platform release installers
        if: needs.reconcile.outputs.state == 'build'
        run: node scripts/ci-platform.mjs build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  publish:
    needs: [reconcile, build]
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    # Queue order is not commit order. The publisher also compares ancestry/version.
    concurrency:
      group: rayrag-release-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
      - name: Restore and verify the exact workflow artifact
        if: needs.reconcile.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.build.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: node scripts/release.mjs restore
      - name: Stage, verify and publish without moving latest backwards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ needs.reconcile.outputs.state }}
          RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.build.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: node scripts/release.mjs publish
