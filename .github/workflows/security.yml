name: Native security
on:
  workflow_call:
  schedule:
    # UTC: every calendar day at 09:37 Bangkok time, outside the busy hour.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        if: matrix.language == 'rust'
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - name: Prepare Rust extraction and generated bridge
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
          npm ci
          npm run bridge
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          # Isolated release-tool graph only; required tests trap braces calls.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
          comment-summary-in-pr: never
          license-check: false

  verify:
    name: Security / required
    needs: [codeql, dependency-review]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require scans and applicable dependency review
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CODEQL_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
