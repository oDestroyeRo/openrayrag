name: Native security
on:
  workflow_call:
  schedule:
    # UTC: every calendar day at 09:37 Bangkok time, outside the busy hour.
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: desktop-codeql-${{ matrix.language }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}-bun-cache
      # Reuse Cargo dependencies, while extracting a fresh database every run.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/../rayrag-codeql-target
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.language == 'rust'
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        if: matrix.language == 'rust'
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install Linux extraction dependencies
        if: matrix.language == 'rust'
        uses: ./.github/actions/linux-dependencies
      - name: Prepare Rust extraction and generated bridge
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          bun install --frozen-lockfile
          bun run bridge
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.language == 'rust'
        with:
          workspaces: src-tauri -> ../../rayrag-codeql-target
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          key: codeql-rust-v4.38.2-${{ hashFiles('vendor/glib/**') }}
          env-vars: CODEQL_EXTRACTOR_RUST_OPTION_
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:${{ matrix.language }}

  bun-audit:
    name: Bun dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Audit both full locks: GitHub dependency review does not index bun.lock.
      - name: Audit desktop dependencies
        run: bun audit --audit-level=high
      - name: Audit isolated release dependencies
        working-directory: tools/release
        # The same isolated exception is guarded by the official-engine tests.
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          # Isolated release-tool graph only; required tests trap braces calls.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
          comment-summary-in-pr: never
          license-check: false

  verify:
    name: Security / required
    needs: [codeql, dependency-review, bun-audit]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require scans and applicable dependency review
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          BUN_AUDIT_RESULT: ${{ needs.bun-audit.result }}
        run: |
          test "$CODEQL_RESULT" = success
          test "$BUN_AUDIT_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
