name: Trusted desktop release
on:
  workflow_call:
    secrets:
      # Environment secrets override the caller's values once the job starts.
      # The caller cannot bind an environment; the runtime guard requires a key.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# Caller env does not propagate into a reusable workflow.
env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: "1.98.1"
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}-bun-cache

jobs:
  reconcile:
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    environment: release
    timeout-minutes: 15
    # Draft inspection and create-only plan reservation require push access.
    permissions:
      contents: write
    outputs:
      state: ${{ steps.preflight.outputs.state }}
      version: ${{ steps.preflight.outputs.version }}
      artifact-id: ${{ steps.preflight.outputs.artifact-id }}
      artifact-run-id: ${{ steps.preflight.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.preflight.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install locked tooling runtime dependencies
        run: bun install --production --frozen-lockfile --ignore-scripts
      - name: Reserve or restore the exact-source semantic release plan
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun install --cwd tools/release --frozen-lockfile --ignore-scripts
          bun scripts/release/release.mjs preflight
      - name: Share the reserved plan with every release stage
        uses: actions/upload-artifact@v7.0.1
        if: steps.preflight.outputs.state != 'skip'
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan.json
          archive: true
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  build:
    needs: reconcile
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.reconcile.outputs.state == 'build'
    runs-on: macos-15
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the release environment signing key
        if: needs.reconcile.outputs.state == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing key is unavailable in the release environment." >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install locked tooling runtime dependencies
        run: bun install --production --frozen-lockfile --ignore-scripts
      - name: Install isolated release policy dependencies
        run: bun install --cwd tools/release --frozen-lockfile --ignore-scripts
      - name: Download the reserved exact-source release plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Install the tested Rust toolchain
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.reconcile.outputs.state == 'build'
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          shared-key: desktop-aarch64-apple-darwin-${{ hashFiles('vendor/glib/**') }}
      - name: Stamp only this exact CI checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          bun scripts/release/release.mjs stamp
          bun install --frozen-lockfile
      - name: Build signed updater archive and bootstrap DMG
        if: needs.reconcile.outputs.state == 'build'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target aarch64-apple-darwin --bundles app,dmg --ci -- --locked
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: signed-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          archive: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  release-platforms:
    needs: reconcile
    if: github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.reconcile.outputs.state == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install locked tooling runtime dependencies
        run: bun install --production --frozen-lockfile --ignore-scripts
      - name: Install isolated release policy dependencies
        run: bun install --cwd tools/release --frozen-lockfile --ignore-scripts
      - name: Download the reserved exact-source release plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Install the tested Rust toolchain
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.reconcile.outputs.state == 'build'
        with:
          workspaces: src-tauri
          save-if: ${{ github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' }}
          shared-key: desktop-${{ matrix.target }}-${{ hashFiles('vendor/glib/**') }}
      - name: Restore Tauri packaging tools
        id: tauri-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
      - name: Install Linux package dependencies
        if: needs.reconcile.outputs.state == 'build' && matrix.platform == 'linux'
        uses: ./.github/actions/linux-dependencies
      - name: Stamp exact trusted main checkout
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release/release.mjs stamp
          bun install --frozen-lockfile
      - name: Build and inspect platform release installers
        if: needs.reconcile.outputs.state == 'build'
        run: bun scripts/quality/ci-platform.mjs build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/${{ matrix.platform }}/*
          archive: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  assemble:
    # All production builders start after reconciliation and join before proof.
    needs: [reconcile, build, release-platforms]
    if: always() && github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.reconcile.result == 'success' && needs.reconcile.outputs.state != 'skip' && (needs.reconcile.outputs.state != 'build' || (needs.build.result == 'success' && needs.release-platforms.result == 'success'))
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id || needs.reconcile.outputs.artifact-id }}
      artifact-run-id: ${{ steps.upload.outputs.artifact-id && github.run_id || needs.reconcile.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest || needs.reconcile.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install locked tooling runtime dependencies
        run: bun install --production --frozen-lockfile --ignore-scripts
      - name: Install isolated release policy dependencies
        run: bun install --cwd tools/release --frozen-lockfile --ignore-scripts
      - name: Download the reserved exact-source release plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Install the tested Rust toolchain for assembly verification
        if: needs.reconcile.outputs.state == 'build'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Stamp the same source and version for native bundle verification
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release/release.mjs stamp
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: signed-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/windows
      - uses: actions/download-artifact@v8.0.1
        if: needs.reconcile.outputs.state == 'build'
        with:
          name: platform-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-bundles/linux
      - name: Verify signatures, app versions, architecture and provenance
        if: needs.reconcile.outputs.state == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/release/release.mjs prepare
      - uses: actions/upload-artifact@v7.0.1
        if: needs.reconcile.outputs.state == 'build'
        id: upload
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/*
          archive: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
      - name: Restore the original signed bundle for an incomplete draft
        if: needs.reconcile.outputs.state == 'reuse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.reconcile.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.reconcile.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.reconcile.outputs.artifact-digest }}
        run: bun scripts/release/release.mjs restore

  publish:
    needs: [reconcile, assemble]
    if: always() && github.repository == 'oDestroyeRo/openrayrag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.reconcile.result == 'success' && needs.assemble.result == 'success' && needs.reconcile.outputs.state != 'skip'
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'tools/release/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - name: Install locked tooling runtime dependencies
        run: bun install --production --frozen-lockfile --ignore-scripts
      - name: Install isolated release policy dependencies
        run: bun install --cwd tools/release --frozen-lockfile --ignore-scripts
      - name: Download the reserved exact-source release plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Restore and verify the exact workflow artifact
        if: needs.reconcile.outputs.state != 'published'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.assemble.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact-digest }}
        run: bun scripts/release/release.mjs restore
      - name: Stage, verify and publish without moving latest backwards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ needs.reconcile.outputs.state }}
          RELEASE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact-id }}
          RELEASE_ARTIFACT_RUN_ID: ${{ needs.assemble.outputs.artifact-run-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact-digest }}
        run: bun scripts/release/release.mjs publish
