[package]
name = "rayrag-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rayrag_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "=0.2.189"
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
plist = "1"
uuid = { version = "1", features = ["v4"] }

# Avoid malformed Mach-O proc macros from Rust 1.98's --strip-debug on macOS.
# This affects build dependencies only, not the final application binary.
[profile.release.build-override]
strip = "none"
