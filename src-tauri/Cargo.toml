[package]
name = "rayrag-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rayrag_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ci-smoke = ["reqwest/json"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Official MCP protocol/Streamable HTTP implementation; Axum hosts its Tower service.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio = { version = "=1.53.2", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reuse the pinned cryptographic digest for credential-safe operation fingerprints.
sha2 = "=0.11.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
tar = "0.4"
flate2 = "1"
plist = "1"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSAlert", "NSButton", "NSView", "NSWindow", "NSScrollView", "NSLayoutConstraint"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }

# Backport RUSTSEC-2024-0429 while Tauri's Linux GTK stack requires GLib 0.18.
# See vendor/glib/PATCHES.md for source integrity and the removal condition.
[patch.crates-io]
glib = { path = "../vendor/glib" }

# Avoid malformed Mach-O proc macros from Rust 1.98's --strip-debug on macOS.
# This affects build dependencies only, not the final application binary.
[profile.release.build-override]
strip = "none"
